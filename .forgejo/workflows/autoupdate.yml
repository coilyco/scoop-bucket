# Advance each manifest to the newest complete upstream release and land the bump.
# Why it exists and what "complete" means: docs/autoupdate.md, scoop-bucket#1.

name: autoupdate

on:
  schedule:
    - cron: "23 * * * *" # hourly, offset off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Advance manifests to newest complete releases
        run: node scripts/update-manifests.mjs

      - name: Commit and push any bumps
        run: bash scripts/ci-commit-bumps.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
