# Advance each manifest to the newest complete upstream release and land the bump.
# Why it exists and what "complete" means: docs/autoupdate.md, scoop-bucket#1.
name: autoupdate

on:
  schedule:
    - cron: "23 * * * *" # hourly, offset off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - id: app
        name: Mint a coilyco-ops App token to push the bump
        uses: coilyco/agentic-os/actions/app-token@0dc318a369ff34254a7187b5b1b85ff9b6580750
        with:
          app_id: ${{ secrets.COILYCO_OPS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_OPS_APP_PRIVATE_KEY_BASE64 }}
          repositories: scoop-bucket

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Advance manifests to newest complete releases
        run: node scripts/update-manifests.mjs

      - name: Commit and push any bumps
        run: bash scripts/ci-commit-bumps.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py
